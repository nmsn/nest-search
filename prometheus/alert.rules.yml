groups:
  - name: nest-search-availability
    rules:
      - alert: ServiceDown
        expr: up{job="nest-search"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 不可用"
          description: "服务已 1 分钟无响应"

  - name: nest-search-performance
    rules:
      - alert: SlowResponse
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 响应过慢"
          description: "P95 = {{ $value }}s"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) /
          sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} 错误率过高"
          description: "错误率 {{ $value | humanizePercentage }}"
